<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTC Options Desk ⚡ War Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #05070a;
        background-image: 
          radial-gradient(ellipse at 50% 0%, rgba(0, 240, 168, 0.04) 0%, transparent 60%),
          radial-gradient(ellipse at 100% 50%, rgba(56, 189, 248, 0.03) 0%, transparent 50%),
          linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        color: #e2e8f0;
        font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* Glow & Flash Keyframes */
      @keyframes flashGreen {
        0% { background-color: rgba(0, 240, 168, 0.35); text-shadow: 0 0 12px #00f0a8; }
        100% { background-color: transparent; text-shadow: none; }
      }
      @keyframes flashRed {
        0% { background-color: rgba(255, 51, 102, 0.35); text-shadow: 0 0 12px #ff3366; }
        100% { background-color: transparent; text-shadow: none; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes neonPulse {
        0%, 100% { box-shadow: 0 0 10px rgba(0, 240, 168, 0.2); }
        50% { box-shadow: 0 0 25px rgba(0, 240, 168, 0.6); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
